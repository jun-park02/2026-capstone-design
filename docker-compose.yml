name: 2026-capstone-design
services:
  backend:
    build:
      context: ./backend 
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # __pycache__ 를 생성하지 않음
      - PYTHONDONTWRITEBYTECODE=1
      # print() 같은 stdout 로그를 버퍼링없이 즉시 출력하게 함?
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - RAW_IMAGE_DIR=/app/images
      - AWS_ACCESS_KEY_ID= ${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY= ${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=ap-northeast-2
      - AWS_S3_BUCKET=2026-capstone-design
      - AWS_S3_KEY_PREFIX=fire-detect
      # optional
      - AWS_S3_PUBLIC_BASE_URL=
      # optional
      - AWS_S3_ENDPOINT_URL=
      # 메일 설정
      - GMAIL_USERNAME=${GMAIL_USERNAME:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL:-}
      - GMAIL_FROM_NAME=${GMAIL_FROM_NAME:-Fire Detect}
      - GMAIL_SMTP_HOST=${GMAIL_SMTP_HOST:-smtp.gmail.com}
      - GMAIL_SMTP_PORT=${GMAIL_SMTP_PORT:-587}
      - GMAIL_USE_TLS=${GMAIL_USE_TLS:-true}
      - FIRE_CONFIRM_BASE_URL=${FIRE_CONFIRM_BASE_URL:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
    volumes:
      - ./mavlink/images:/app/images
    networks:
      - app-network
    depends_on:
      - mysql
  
  udp-rx:
    build:
      context: ./mavlink
    container_name: udp-rx
    ports:
      - "14550:14550/udp"  # UDP 포트 매핑
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UDP_PORT=14550
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=mystream
    command: python receiver.py
    networks:
      - app-network
    depends_on:
      - redis
  
  udp-tx:
    build:
      context: ./mavlink
    container_name: udp-tx
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TARGET_IP=udp-rx  # Docker 네트워크에서 서비스 이름으로 접근
      - TARGET_PORT=14550
    command: python transmitter.py
    networks:
      - app-network
    depends_on:
      - udp-rx

  raw-udp-rx:
    build:
      context: ./mavlink
    container_name: raw-udp-rx
    ports:
      - "14551:14551/udp"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UDP_PORT=14551
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=fire_detect
      - IMG_SAVE_DIR=/app/images
      - SESSION_TIMEOUT_SEC=20
    command: python raw_receiver.py
    volumes:
      - ./mavlink/images:/app/images
    networks:
      - app-network
    depends_on:
      - redis
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: mysql:8.4.8
    ports:
      - "23306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  
  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=host.docker.internal
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
