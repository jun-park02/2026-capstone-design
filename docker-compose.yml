  image-upload-fastapi:
    build:
      context: ./mavlink
    container_name: image-upload-fastapi
    ports:
      - "14551:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - HTTP_PORT=8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=fire_detect
      - IMG_SAVE_DIR=/app/images
      - MAX_UPLOAD_BYTES=20971520
    command: python fastapi_image_upload.py
    volumes:
      - ./mavlink/images:/app/images
    networks:
      - app-network
    depends_on:
      - redis
  
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  mysql:
    image: mysql:8.4.8
    ports:
      - "23306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  
  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=host.docker.internal
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
