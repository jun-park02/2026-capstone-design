name: 2026-capstone-design
services:
  backend:
    build:
      context: ./backend 
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # __pycache__ 를 생성하지 않음
      - PYTHONDONTWRITEBYTECODE=1
      # print() 같은 stdout 로그를 버퍼링없이 즉시 출력하게 함?
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - RAW_IMAGE_DIR=/app/images
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=ap-northeast-2
      - AWS_S3_BUCKET=2026-capstone-design
      - AWS_S3_KEY_PREFIX=fire-detect
      # optional
      - AWS_S3_PUBLIC_BASE_URL=
      # optional
      - AWS_S3_ENDPOINT_URL=
      # 메일 설정
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL}
      - GMAIL_FROM_NAME=${GMAIL_FROM_NAME}
      - GMAIL_SMTP_HOST=${GMAIL_SMTP_HOST}
      - GMAIL_SMTP_PORT=${GMAIL_SMTP_PORT}
      - GMAIL_USE_TLS=${GMAIL_USE_TLS}
      - FIRE_CONFIRM_BASE_URL=${FIRE_CONFIRM_BASE_URL}
      - APP_BASE_URL=${APP_BASE_URL}
    volumes:
      - ./mavlink/images:/app/images
    networks:
      - app-network
    depends_on:
      - mysql
  
  drone-telemetry-udp-rx:
    build:
      context: ./mavlink
    container_name: drone-telemetry-udp-rx
    ports:
      - "14550:14550/udp" 
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UDP_PORT=14550
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=drone_telemetry
      - JSON_SAMPLE_INTERVAL_SEC=2
      - SIMTIME_UNIT=seconds
      - DEFAULT_DRONE_ID=1
    command: python drone_telemetry_rx.py
    networks:
      - app-network
    depends_on:
      - redis
  
