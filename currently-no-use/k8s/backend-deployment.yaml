apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: capstone-design
  labels:
    app: backend
spec:
  replicas: 2  # 초기 replica 수
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # 이미지 빌드 후 레지스트리에 푸시 필요
        # 예: image: your-registry/backend:latest
        image: backend:latest  # 로컬 빌드 또는 레지스트리 이미지
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        - name: STREAM_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: STREAM_KEY
        - name: CONSUMER_GROUP
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CONSUMER_GROUP
        - name: REDIS_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_BATCH_SIZE
        - name: REDIS_BLOCK_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_BLOCK_TIMEOUT
        - name: REDIS_POLL_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_POLL_INTERVAL
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"  # HPA가 CPU 사용량을 모니터링하기 위해 필요
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: capstone-design
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: backend

