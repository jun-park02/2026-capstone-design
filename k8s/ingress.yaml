apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: capstone-design
  annotations:
    # nginx ingress controller 사용 시
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: backend.example.com  # 실제 도메인으로 변경
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000

