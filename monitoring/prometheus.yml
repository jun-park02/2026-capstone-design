global: # 별도로 재정의하지 않은 수집 작업에 적용할 공통 설정이다.
  scrape_interval: 15s # 각 대상의 지표를 15초마다 수집한다.
  evaluation_interval: 15s # 기록 규칙과 알림 규칙이 설정되어 있으면 15초마다 평가한다.

scrape_configs: # 지표를 수집할 작업 목록을 정의한다.
  - job_name: backend # 이 작업에서 수집한 지표에 job="backend" 라벨을 붙인다.
    metrics_path: /metrics # 대상 서버에서 지표를 읽어 올 HTTP 경로를 지정한다.
    static_configs: # 수집 대상 주소를 직접 지정한다.
      - targets: # 이 설정 그룹에서 수집할 서버 주소 목록이다.
          - backend:8000 # Docker 네트워크의 backend 서비스에 컨테이너 내부 포트 8000으로 접속한다.

  - job_name: image-upload # 이 작업에서 수집한 지표에 job="image-upload" 라벨을 붙인다.
    metrics_path: /metrics # 이미지 업로드 서버의 /metrics 경로에서 지표를 읽는다.
    static_configs: # 이미지 업로드 서버의 수집 대상 주소를 직접 지정한다.
      - targets: # 이 설정 그룹에서 수집할 서버 주소 목록이다.
          - image-upload-fastapi:8000 # Docker 내부에서는 호스트 포트 14551이 아닌 컨테이너 포트 8000을 사용한다.
